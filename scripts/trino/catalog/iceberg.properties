connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=dex
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://dex-trino-catalog:5432/postgres
iceberg.jdbc-catalog.connection-user=postgres
iceberg.jdbc-catalog.connection-password=${ENV:DEX_TRINO_CATALOG_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=local:///warehouse
fs.local.enabled=true
local.location=/data/trino
